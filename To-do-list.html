*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header{display:flex;align-items:center;gap:12px;margin:8px 4px 14px}
h1{font-size:26px;margin:0 0 0 28px;letter-spacing:-.5px;flex:1;min-width:0;white-space:nowrap}
.menu-btn{background:none;border:0;color:var(--text);font-size:15px;padding:8px}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--text);font:600 14px inherit;font-family:inherit;
  padding:8px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg .n{color:var(--muted);font-weight:500;margin-left:4px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px;overflow:hidden}
li{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.front{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  touch-action:pan-y;transition:transform .2s ease;will-change:transform;user-select:none;-webkit-user-select:none}
.front.drag{transition:none}
.star{flex:none;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);opacity:.55;padding:4px 2px}
.star.on{color:#ffcc00;opacity:1}
.swdel{position:absolute;right:0;top:0;bottom:0;width:90px;background:var(--late);color:#fff;border:0;
  font:600 15px -apple-system,sans-serif}
li:last-child{border-bottom:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:none;
  display:grid;place-items:center;padding:0;color:#fff}
.done .chk{background:var(--ok);border-color:var(--ok)}
.chk svg{width:14px;height:14px;opacity:0}
.done .chk svg{opacity:1}
.body{flex:1;min-width:0}
.t{word-break:break-word}
.body{cursor:pointer}
.done .t{text-decoration:line-through;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.tag{font-weight:600;color:#fff;padding:0 8px;border-radius:9px;font-size:12px}
.late{color:var(--perso);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:58px;height:58px;
  border-radius:50%;border:2px solid rgba(255,255,255,.3);background:#494f3b;color:#fff;font-size:34px;line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h2{margin:0 0 12px;font-size:17px;text-align:center}
.field{background:var(--card);border-radius:12px;padding:0 14px;margin-bottom:12px}
.field input[type=text],.field input[type=date]{width:100%;border:0;background:none;color:var(--text);
  font:inherit;padding:13px 0;outline:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.row+.row{border-top:1px solid var(--line)}
.row input[type=checkbox]{width:22px;height:22px}
.actions{display:flex;gap:10px}
.actions button{flex:1;padding:13px;border-radius:12px;border:0;font:600 17px inherit;font-family:inherit}
.cancel{background:var(--seg);color:var(--text)}
.add{background:var(--pro);color:#fff}
.add:disabled{opacity:.4}
.lab{font-size:13px;color:var(--muted);margin:0 4px 6px;text-transform:uppercase;letter-spacing:.3px}
#rubSeg button,#echSeg button{font-size:14px;padding:9px 2px}
#seg button,#segE button,#rubSeg button{font-size:12px;white-space:nowrap;padding-left:1px;padding-right:1px}
#seg button,#segE button{display:flex;flex-direction:column;align-items:center;line-height:1.2}
#seg .n,#segE .n{margin:0;font-size:11px}
#segE button{white-space:normal;font-size:12px}
#seg{margin-bottom:8px}
.sw-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border-radius:12px;padding:10px 14px;gap:14px}
.pop .sw-row{background:none;border-radius:0;margin:0}
.pop .sw-row span:first-child{font-size:16px}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--seg);border-radius:16px;transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(20px)}
.tabs button{font-size:15px!important;padding:9px 4px!important}
.grp{margin:18px 4px 8px;font-size:13px}
.grp .n{color:var(--muted);font-weight:500;margin-left:6px}
#echSeg button{white-space:normal}
.pop{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 56px);background:var(--card);
  border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;z-index:5;min-width:300px}
.pop.open{display:block}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
  font:inherit;padding:13px 16px}
.pop button+button{border-top:1px solid var(--line)}
.pop .danger{color:var(--late)}
#seg{flex-wrap:wrap;gap:2px}
#seg button{flex:1 0 auto;min-width:0;padding:8px 10px}
#rubSeg{flex-wrap:wrap;gap:2px}
.brk{flex-basis:100%;height:0}
.gsep{flex:0 0 1px;background:var(--line);margin:4px 3px}
#rubSeg button{flex:1 0 14%}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#rGrp button{font-size:13px}
.brand{flex:none;margin:0}
.brand img{display:block;height:40px;width:auto}
.colrow{background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.colrow .sw-t{font-size:13px;color:var(--muted);margin-bottom:8px}
.colrow .swatches{padding:0;gap:10px}
.colrow .swatch{width:30px;height:30px}
.sheet.scroll{max-height:88vh;overflow-y:auto}
.filebtn{display:block;text-align:center;padding:13px;border-radius:12px;font-weight:600;margin-bottom:10px}
#impTxt{width:100%;min-height:90px;background:var(--card);color:var(--text);border:0;border-radius:12px;padding:10px 12px;font:13px ui-monospace,Menlo,monospace;resize:vertical}
.note{font-size:13px;color:var(--muted);min-height:18px;margin:6px 4px 0}
.del-rub{margin-top:12px;background:none;border:0;color:var(--late);font:inherit;font-size:14px;padding:6px 0}
.danger-btn{background:var(--late);color:#fff}
.colrow .actions button{padding:11px;font-size:15px}
#seg button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style>
</head>

<script>
const R = {offres:{label:"OF",color:"#0a84ff"}, fa:{label:"FA",color:"#00a88f"}, events:{label:"Events",color:"#e0a800"}, taches:{label:"Divers",color:"#ff9500"}, equipe:{label:"GC",color:"#ff2d55"}, ga:{label:"GA",color:"#af52de"}, br:{label:"BR",color:"#30b0c7"}, bo:{label:"BO",color:"#5856d6"}, wg:{label:"WG",color:"#a2845e"}, bu:{label:"BU",color:"#32ade6"}};
const GROUPES = [["offres","fa","events","taches"],["equipe","ga","br","bo","wg","bu"]];
const PALETTE = ["#0a84ff","#00a88f","#ff9500","#ff2d55","#af52de","#30b0c7","#5856d6","#a2845e","#32ade6","#e0a800","#494f3b"];
const VERT_FONCE = "#494f3b";
const cadre = c => String(c).toLowerCase()===VERT_FONCE ? "box-shadow:inset 0 0 0 2px #6f7759;" : "";
const BASE_KEYS = Object.keys(R);
const BASE_COLORS = Object.fromEntries(BASE_KEYS.map(k=>[k,R[k].color]));
const BASE_GROUPES = GROUPES.map(g=>[...g]);
const BASE_DEFS = JSON.parse(JSON.stringify(R));
let supprimees = [], confSuppr = false;
const groupesVisibles = () => GROUPES.filter(g=>g.length);
function retirerDuModele(k){ delete R[k]; GROUPES.forEach(g=>{ const i=g.indexOf(k); if(i>=0) g.splice(i,1); }); }
function chargerSupprimees(){ try{ supprimees = JSON.parse(localStorage.getItem("supprimees-v1")||"[]"); }catch(e){ supprimees=[]; } supprimees.forEach(retirerDuModele); }
function sauverSupprimees(){ try{ localStorage.setItem("supprimees-v1", JSON.stringify(supprimees)); }catch(e){} }
let custom = [];
function appliquerRub(c){ R[c.key]={label:c.label,color:c.color}; while(GROUPES.length<=c.g) GROUPES.push([]); GROUPES[c.g].push(c.key); }
function chargerRub(){ try{ custom = JSON.parse(localStorage.getItem("rubriques-v1")||"[]"); }catch(e){ custom=[]; } custom.forEach(appliquerRub); }
let couleurs = {};
function chargerCouleurs(){ try{ couleurs = JSON.parse(localStorage.getItem("couleurs-v1")||"{}"); }catch(e){ couleurs={}; } Object.entries(couleurs).forEach(([k,c])=>{ if(R[k]) R[k].color=c; }); }
function changerCouleur(k,c){ R[k].color=c; couleurs[k]=c; try{ localStorage.setItem("couleurs-v1", JSON.stringify(couleurs)); }catch(e){} }
function sauverRub(){ try{ localStorage.setItem("rubriques-v1", JSON.stringify(custom)); }catch(e){} }
const E = {semaine:{label:"S",ordre:0}, prochaine:{label:"S+1",ordre:1}, s2:{label:"S+2",ordre:2}, pense:{label:"Pense-bête",ordre:3}};
const KEY = "taches-v2";
let taches = [], filtre = "toutes", fEch = "toutes", masquer = false, vue = "toutes", rub = "taches", ech = "pense";

function charger(){
  try{
    taches = JSON.parse(localStorage.getItem(KEY)||"null");
    if(!taches){ // migration depuis la version précédente
      const old = JSON.parse(localStorage.getItem("taches-v1")||"[]");
      taches = old.map(t=>({id:t.id,titre:t.titre,rub:"taches",done:t.done,ech:"pense"}));
    }
  }catch(e){ taches=[]; }
  // normalisation : anciennes rubriques -> « Tâches », « Ce weekend » -> « Semaine prochaine »
  taches.forEach(t=>{ if(!R[t.rub]) t.rub="taches"; if(t.ech==="weekend") t.ech="prochaine"; if(!E[t.ech]) t.ech="pense"; });
}
function sauver(){ try{ localStorage.setItem(KEY, JSON.stringify(taches)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nOpen = r => taches.filter(t=>t.rub===r && !t.done && (fEch==="toutes"||t.ech===fEch)).length;
const nOpenE = e => taches.filter(t=>t.ech===e && !t.done && (filtre==="toutes"||t.rub===filtre)).length;

function ligne(t, afficherTag){
  return `<li class="${t.done?"done":""}" style="--c:${R[t.rub].color}" data-id="${t.id}">
      <button class="swdel" data-del="${t.id}">Supprimer</button>
      <div class="front"><button class="chk" data-id="${t.id}" aria-label="Terminer"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5l3.2 3.2L12 3.5"/></svg></button>
      <div class="body"><div class="t">${esc(t.titre)}</div>
        <div class="meta">${afficherTag?`<span class="tag" style="background:${R[t.rub].color}">${R[t.rub].label}</span>`:""}
        ${vue==="proches"?"":`<span class="${t.ech==="semaine"&&!t.done?"late":""}">${E[t.ech].label}</span>`}</div></div>
      <button class="star ${t.fav?"on":""}" data-star="${t.id}" aria-label="Favori">${t.fav?"★":"☆"}</button></div></li>`;
}
const nProches = () => taches.filter(t=>t.ech==="semaine" && !t.done).length;

function render(){
  ouvert=null;
  $("vueSeg").innerHTML = `<button data-v="proches" class="${vue==="proches"?"on":""}">Proches (${nProches()})</button><button data-v="toutes" class="${vue==="toutes"?"on":""}">Toutes les tâches</button>`;
  $("filtres").style.display = vue==="toutes" ? "" : "none";

  if(vue==="proches"){
    const l = taches.filter(t=>t.ech==="semaine" && !t.done);
    if(!l.length){ $("list").innerHTML = `<div class="empty">Rien d'ouvert pour cette semaine.</div>`; return; }
    $("list").innerHTML = GROUPES.flat().map(r=>{
      const g = l.filter(t=>t.rub===r).sort((a,b)=>((b.fav?1:0)-(a.fav?1:0)) || (b.id-a.id));
      if(!g.length) return "";
      return `<div class="grp"><span class="tag" style="background:${R[r].color};font-size:13px;padding:2px 10px">${R[r].label}</span><span class="n">${g.length}</span></div><ul>${g.map(t=>ligne(t,false)).join("")}</ul>`;
    }).join("");
    return;
  }

  const bf = f => `<button data-f="${f}" class="${filtre===f?"on":""}" ${filtre===f&&f!=="toutes"?`style="background:${R[f].color};color:#fff;${cadre(R[f].color)}"`:""}>${f==="toutes" ? "Toutes" : `${R[f].label}<span class="n">${nOpen(f)}</span>`}</button>`;
  $("seg").innerHTML = bf("toutes") + groupesVisibles().map(g=>g.map(bf).join("")).join('<span class="brk"></span>');
  $("segE").innerHTML = ["toutes","semaine","prochaine","s2","pense"].map(f=>{
    const lab = f==="toutes" ? "Toutes" : `${E[f].label}<span class="n">${nOpenE(f)}</span>`;
    return `<button data-e="${f}" class="${fEch===f?"on":""}">${lab}</button>`;
  }).join("");
  $("colEdit").style.display="none"; $("colEdit").innerHTML="";
  let l = taches.filter(t => (filtre==="toutes"||t.rub===filtre) && (fEch==="toutes"||t.ech===fEch) && !(masquer&&t.done));
  l = l.slice().sort((a,b)=> ((b.fav?1:0)-(a.fav?1:0)) || (a.done-b.done) || (E[a.ech].ordre-E[b.ech].ordre) || (b.id-a.id));
  if(!l.length){ $("list").innerHTML = `<div class="empty">Aucune tâche.<br>Appuyez sur + pour en ajouter une.</div>`; return; }
  $("list").innerHTML = "<ul>" + l.map(t=>ligne(t, filtre==="toutes")).join("") + "</ul>";
}

$("vueSeg").onclick = e => { const b=e.target.closest("button"); if(b){ vue=b.dataset.v; render(); } };
$("seg").onclick = e => { const b=e.target.closest("button"); if(b){ if(lpFait){ lpFait=false; return; } filtre=b.dataset.f; confSuppr=false; render(); } };
const nTaches = k => taches.filter(t=>t.rub===k).length;
function supprimerRub(k){
  taches.forEach(t=>{ if(t.rub===k) t.rub="taches"; });
  custom = custom.filter(c=>c.key!==k); sauverRub();
  if(BASE_KEYS.includes(k)){ supprimees.push(k); sauverSupprimees(); }
  retirerDuModele(k); delete couleurs[k]; try{ localStorage.setItem("couleurs-v1", JSON.stringify(couleurs)); }catch(e){}
  sauver(); filtre="toutes"; confSuppr=false; majRubSeg(); render();
}
$("segE").onclick = e => { const b=e.target.closest("button"); if(b){ fEch=b.dataset.e; render(); } };
let sw=null, ouvert=null, ignorerClic=false;
function fermerOuvert(sauf){ if(ouvert&&ouvert!==sauf){ ouvert.style.transform=""; ouvert=null; } }
function effacer(id){ taches=taches.filter(x=>x.id!=id); sauver(); render(); }
$("list").addEventListener("pointerdown", e=>{
  const f=e.target.closest(".front");
  if(!f){ if(!e.target.closest(".swdel")) fermerOuvert(); return; }
  fermerOuvert(f);
  sw={f,x:e.clientX,y:e.clientY,base:f===ouvert?-90:0,horiz:null,cur:0,id:e.pointerId};
});
$("list").addEventListener("pointermove", e=>{
  if(!sw||e.pointerId!==sw.id) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(sw.horiz===null){
    if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
    sw.horiz = Math.abs(dx)>Math.abs(dy);
    if(!sw.horiz){ sw=null; return; }
    try{ sw.f.setPointerCapture(e.pointerId); }catch(_){}
    sw.f.classList.add("drag");
  }
  sw.cur = Math.max(-window.innerWidth, Math.min(0, sw.base+dx));
  sw.f.style.transform = `translateX(${sw.cur}px)`;
});
function finGeste(e){
  if(!sw||e.pointerId!==sw.id) return;
  const s=sw; sw=null;
  if(!s.horiz) return;
  s.f.classList.remove("drag");
  ignorerClic=true; setTimeout(()=>ignorerClic=false,60);
  if(s.cur < -Math.min(170, window.innerWidth*0.45)){
    s.f.style.transform="translateX(-110%)";
    const id=s.f.parentNode.dataset.id; setTimeout(()=>effacer(id),180);
  } else if(s.cur < -45){
    s.f.style.transform="translateX(-90px)"; ouvert=s.f;
  } else {
    s.f.style.transform=""; if(ouvert===s.f) ouvert=null;
  }
}
$("list").addEventListener("pointerup", finGeste);
$("list").addEventListener("pointercancel", finGeste);
$("list").onclick = e => {
  if(ignorerClic) return;
  if(e.target.closest(".front")===ouvert && ouvert){ fermerOuvert(); return; }
  const corps=e.target.closest(".body");
  if(corps){ const t=taches.find(x=>x.id==corps.closest("li").dataset.id); if(t) ouvrirForm(t); return; }
  const c=e.target.closest(".chk"), d=e.target.closest(".swdel"), st=e.target.closest(".star");
  if(c){ const t=taches.find(x=>x.id==c.dataset.id); t.done=!t.done; sauver(); render(); }
  if(d){ effacer(d.dataset.del); }
  if(st){ const t=taches.find(x=>x.id==st.dataset.star); t.fav=!t.fav; sauver(); render(); }
};

$("swRow").onclick = e => e.stopPropagation();
$("menuBtn").onclick = e => { e.stopPropagation(); $("pop").classList.toggle("open"); };
document.addEventListener("click", ()=>$("pop").classList.remove("open"));
$("hideDone").onchange = () => { masquer=$("hideDone").checked; try{localStorage.setItem("masquer-v1",masquer?"1":"0");}catch(e){} render(); };
$("clearDone").onclick = () => { taches=taches.filter(t=>!t.done); sauver(); render(); };

function majRubSeg(){
  if(!R[rub]) rub="taches";
  $("rubSeg").innerHTML = groupesVisibles().map(g=>g.map(k=>`<button type="button" data-r="${k}">${esc(R[k].label)}</button>`).join("")).join('<span class="brk"></span>');
  setRub(rub);
}
function setRub(r){ rub=r; [...$("rubSeg").children].forEach(b=>{ const on=b.dataset.r===r; b.classList.toggle("on", on); b.style.background = on&&R[r] ? R[r].color : ""; b.style.color = on ? "#fff" : ""; b.style.boxShadow = on&&R[r] ? (R[r].color.toLowerCase()===VERT_FONCE ? "inset 0 0 0 2px #6f7759" : "") : ""; }); }
function setEch(e){ ech=e; [...$("echSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.e===e)); }
$("echSeg").onclick = e => { const b=e.target.closest("button"); if(b) setEch(b.dataset.e); };
$("rubSeg").onclick = e => { const b=e.target.closest("button"); if(b) setRub(b.dataset.r); };
let editId = null;
function ouvrirForm(t){
  editId = t ? t.id : null;
  $("formTitre").textContent = t ? "Modifier la tâche" : "Nouvelle tâche";
  $("submit").textContent = t ? "Enregistrer" : "Ajouter";
  $("titre").value = t ? t.titre : "";
  $("favIn").checked = t ? !!t.fav : false;
  $("submit").disabled = !$("titre").value.trim();
  setRub(t ? t.rub : (filtre==="toutes"?"taches":filtre));
  setEch(t ? t.ech : (vue==="proches"?"semaine":"pense"));
  $("bg").classList.add("open"); if(!t) setTimeout(()=>$("titre").focus(),50);
}
$("fab").onclick = () => ouvrirForm(null);
const fermer = () => $("bg").classList.remove("open");
$("cancel").onclick = fermer;
$("bg").onclick = e => { if(e.target===$("bg")) fermer(); };
$("titre").oninput = () => $("submit").disabled = !$("titre").value.trim();
$("form").onsubmit = e => {
  e.preventDefault();
  const titre=$("titre").value.trim(); if(!titre) return;
  if(editId!==null){
    const t=taches.find(x=>x.id==editId);
    if(t){ t.titre=titre; t.rub=rub; t.ech=ech; t.fav=$("favIn").checked; }
  } else {
    taches.push({id:Date.now(), titre, rub, done:false, ech, fav:$("favIn").checked});
  }
  sauver(); fermer(); render();
};

let rGrp = 0, rCol = PALETTE[0];
function majDialRub(){
  $("rGrp").innerHTML = GROUPES.map((g,i)=>g.length?`<button type="button" data-g="${i}" class="${rGrp===i?"on":""}">Groupe ${i+1}</button>`:"").join("")
    + `<button type="button" data-g="${GROUPES.length}" class="${rGrp===GROUPES.length?"on":""}">Nouveau</button>`;
  $("rCol").innerHTML = PALETTE.map(c=>`<button type="button" class="swatch ${c===rCol?"on":""}" data-c="${c}" style="background:${c}" aria-label="Couleur"></button>`).join("");
  const nom=$("rNom").value.trim().toLowerCase();
  $("rSubmit").disabled = !nom || Object.values(R).some(r=>r.label.toLowerCase()===nom);
}
$("addRub").onclick = () => { $("rNom").value=""; rGrp=GROUPES.reduce((m,g,i)=>g.length?i:m,0); rCol=PALETTE[0]; majDialRub(); $("bgR").classList.add("open"); setTimeout(()=>$("rNom").focus(),50); };
$("rNom").oninput = majDialRub;
$("rGrp").onclick = e => { const b=e.target.closest("button"); if(b){ rGrp=+b.dataset.g; majDialRub(); } };
$("rCol").onclick = e => { const b=e.target.closest("button"); if(b){ rCol=b.dataset.c; majDialRub(); } };
const fermerR = () => $("bgR").classList.remove("open");
$("rCancel").onclick = fermerR;
$("bgR").onclick = e => { if(e.target===$("bgR")) fermerR(); };
$("formR").onsubmit = e => {
  e.preventDefault();
  const label=$("rNom").value.trim(); if($("rSubmit").disabled) return;
  const c={key:"c"+Date.now(), label, color:rCol, g:rGrp};
  custom.push(c); appliquerRub(c); sauverRub();
  filtre=c.key; vue="toutes"; majRubSeg(); fermerR(); render();
};

// ---------- Sauvegarde : export / import ----------
function donnees(){ return {app:"todo-list", version:1, exportedAt:new Date().toISOString(), taches, rubriques:custom, couleurs, supprimees}; }
function nomFichier(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `todo-list-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`; }
let dlCap = null;
(async()=>{ try{ if(typeof claude!=="undefined" && claude.use) dlCap = await claude.use("downloads"); }catch(e){} })();
const msgE = t => $("expMsg").textContent = t;
const msgI = t => $("impMsg").textContent = t;
let pending = null;

$("openSave").onclick = () => { msgE(""); msgI(""); $("impTxt").value=""; pending=null; $("impGo").disabled=true; $("bgS").classList.add("open"); };
$("sClose").onclick = () => $("bgS").classList.remove("open");
$("bgS").onclick = e => { if(e.target===$("bgS")) $("bgS").classList.remove("open"); };

$("expFile").onclick = async () => {
  const json = JSON.stringify(donnees(), null, 2);
  try{
    if(dlCap){ await dlCap.save({filename:nomFichier(), data:json}); msgE("Fichier prêt."); return; }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download=nomFichier();
    document.body.appendChild(a); a.click(); a.remove();
    msgE("Export lancé. Si rien ne se télécharge, utilisez « Copier ».");
  }catch(e){ msgE(e && e.code==="declined" ? "Export annulé." : "Export impossible ici : utilisez « Copier »."); }
};
$("expCopy").onclick = async () => {
  const json = JSON.stringify(donnees(), null, 2);
  try{ await navigator.clipboard.writeText(json); msgE("Données copiées dans le presse-papiers."); }
  catch(e){ $("impTxt").value=json; $("impTxt").focus(); $("impTxt").select(); pending=null; $("impGo").disabled=true;
    msgE("Copie bloquée : le texte est dans la zone ci-dessous, copiez-le à la main."); msgI(""); }
};

function nettoyer(d){
  if(!d || typeof d!=="object" || !Array.isArray(d.taches)) throw new Error("format");
  const hex=/^#[0-9a-fA-F]{6}$/;
  const rubs=(Array.isArray(d.rubriques)?d.rubriques:[]).filter(c=>c && typeof c.key==="string" && /^[\w-]{1,40}$/.test(c.key) && !BASE_KEYS.includes(c.key)
      && typeof c.label==="string" && c.label.trim() && hex.test(c.color) && Number.isInteger(c.g) && c.g>=0 && c.g<10)
    .map(c=>({key:c.key,label:c.label.trim().slice(0,12),color:c.color,g:c.g}));
  const cou={}; if(d.couleurs && typeof d.couleurs==="object") for(const [k,v] of Object.entries(d.couleurs)) if(hex.test(v)) cou[k]=v;
  const ts=d.taches.filter(t=>t && typeof t.titre==="string" && t.titre.trim())
    .map((t,i)=>({id:Number.isFinite(t.id)?t.id:Date.now()+i, titre:t.titre.trim().slice(0,500), rub:typeof t.rub==="string"?t.rub:"taches", done:!!t.done, ech:E[t.ech]?t.ech:"pense", fav:!!t.fav}));
  const sup=(Array.isArray(d.supprimees)?d.supprimees:[]).filter(k=>BASE_KEYS.includes(k) && k!=="taches");
  return {taches:ts, rubriques:rubs, couleurs:cou, supprimees:sup};
}
function preparer(txt){
  try{
    pending = nettoyer(JSON.parse(txt));
    const n=pending.taches.length, r=pending.rubriques.length;
    msgI(`${n} tâche${n>1?"s":""} et ${r} rubrique${r>1?"s":""} personnalisée${r>1?"s":""} trouvée${n>1||r>1?"s":""}. Elles remplaceront les données actuelles.`);
    $("impGo").disabled=false;
  }catch(e){ pending=null; $("impGo").disabled=true; msgI("Données non reconnues."); }
}
$("impTxt").oninput = () => { const t=$("impTxt").value.trim(); if(!t){ pending=null; $("impGo").disabled=true; msgI(""); } else preparer(t); };
$("impFile").onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  try{ const t=await f.text(); $("impTxt").value=t; preparer(t); }catch(_){ msgI("Lecture du fichier impossible."); }
  e.target.value="";
};
function resetCustom(){
  Object.keys(R).forEach(k=>delete R[k]);
  BASE_KEYS.forEach(k=>R[k]={...BASE_DEFS[k]});
  GROUPES.length=0; BASE_GROUPES.forEach(g=>GROUPES.push([...g]));
}
$("impGo").onclick = () => {
  if(!pending) return;
  resetCustom();
  custom = pending.rubriques; custom.forEach(appliquerRub);
  supprimees = pending.supprimees; supprimees.forEach(retirerDuModele); sauverSupprimees();
  couleurs = pending.couleurs; Object.entries(couleurs).forEach(([k,c])=>{ if(R[k]) R[k].color=c; });
  taches = pending.taches; taches.forEach(t=>{ if(!R[t.rub]) t.rub="taches"; });
  sauverRub(); sauver(); try{ localStorage.setItem("couleurs-v1", JSON.stringify(couleurs)); }catch(e){}
  pending=null; filtre="toutes"; fEch="toutes"; vue="toutes";
  majRubSeg(); render(); $("bgS").classList.remove("open");
};

// ---------- Appui long sur une rubrique : choix de la couleur ----------
let lpT=null, lpFait=false, lpX=0, lpY=0, cKey=null;
function majCouleurs(){
  $("cCol").innerHTML = PALETTE.map(c=>`<button type="button" class="swatch ${R[cKey]&&R[cKey].color===c?"on":""}" data-c="${c}" style="background:${c}" aria-label="Couleur"></button>`).join("");
}
let cConf=false;
function majSuppr(){
  const k=cKey, n=taches.filter(t=>t.rub===k).length;
  $("cSuppr").innerHTML = k==="taches" ? "" : cConf
    ? `<div class="note" style="margin:0 4px 8px">${n} tâche${n>1?"s":""} ser${n>1?"ont":"a"} déplacée${n>1?"s":""} vers « ${esc(R.taches.label)} ».</div><div class="actions" style="margin-bottom:12px"><button type="button" class="cancel" data-act="annuler">Annuler</button><button type="button" class="danger-btn" data-act="confirmer">Supprimer la rubrique</button></div>`
    : `<button type="button" class="del-rub" data-act="suppr" style="margin:0 4px 12px">Supprimer cette rubrique…</button>`;
}
$("cSuppr").onclick = e => { const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="suppr"){ cConf=true; majSuppr(); }
  else if(a.dataset.act==="annuler"){ cConf=false; majSuppr(); }
  else if(a.dataset.act==="confirmer"){ supprimerRub(cKey); $("bgC").classList.remove("open"); } };
function ouvrirCouleur(k){
  if(!R[k]) return; cKey=k; cConf=false; majSuppr();
  $("cTitre").textContent = `Couleur de « ${R[k].label} »`;
  majCouleurs(); $("bgC").classList.add("open");
}
const stopLP = () => { clearTimeout(lpT); lpT=null; };
$("seg").addEventListener("pointerdown", e=>{
  const b=e.target.closest("button[data-f]"); if(!b || b.dataset.f==="toutes") return;
  lpFait=false; lpX=e.clientX; lpY=e.clientY; const k=b.dataset.f;
  stopLP(); lpT=setTimeout(()=>{ lpT=null; lpFait=true; try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} ouvrirCouleur(k); }, 500);
});
$("seg").addEventListener("pointermove", e=>{ if(lpT && Math.hypot(e.clientX-lpX,e.clientY-lpY)>10) stopLP(); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("seg").addEventListener(ev, stopLP));
$("seg").addEventListener("contextmenu", e=>e.preventDefault());
$("cCol").onclick = e => { const b=e.target.closest(".swatch"); if(!b||!cKey) return;
  changerCouleur(cKey,b.dataset.c); majRubSeg(); render(); $("bgC").classList.remove("open"); };
$("cClose").onclick = () => $("bgC").classList.remove("open");
$("bgC").onclick = e => { if(e.target===$("bgC")) $("bgC").classList.remove("open"); };
try{ masquer = localStorage.getItem("masquer-v1")==="1"; }catch(e){}
$("hideDone").checked = masquer;
chargerRub(); chargerSupprimees(); chargerCouleurs(); charger(); majRubSeg(); setRub("taches"); setEch("pense"); render();
</script>
</body>
