<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relevés compteurs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compteurs">
<meta name="theme-color" content="#1C2321">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231C2321'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23E8A33D' stroke-width='5'/%3E%3Cline x1='50' y1='50' x2='50' y2='30' stroke='%23E8A33D' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='64' y2='58' stroke='%234FB8B0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#1C2321;
    --bg-raised:#242C29;
    --line:#3A423F;
    --text:#F2F0E9;
    --text-dim:#9BA39D;
    --elec:#E8A33D;
    --eau:#4FB8B0;
    --danger:#C1554B;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
    padding-top:env(safe-area-inset-top);
  }
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}

  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0;
    font-size:20px;
    font-weight:650;
    letter-spacing:0.01em;
  }
  header .sub{
    margin-top:4px;
    font-size:13px;
    color:var(--text-dim);
  }
  .dial{
    display:inline-block;width:9px;height:9px;border-radius:50%;
    margin-right:6px;vertical-align:middle;
  }
  .dial.elec{background:var(--elec);}
  .dial.eau{background:var(--eau);}

  main{padding:18px 20px 8px;max-width:520px;margin:0 auto;}

  .banner{
    background:linear-gradient(90deg, rgba(232,163,61,0.12), rgba(232,163,61,0.04));
    border:1px solid rgba(232,163,61,0.4);
    border-radius:var(--radius);
    padding:13px 15px;
    font-size:13.5px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .banner strong{color:var(--elec);font-weight:650;}

  .card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{
    margin:0 0 14px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    font-weight:650;
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;
  }
  .field input[type=date],
  .field input[type=number]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 13px;
    color:var(--text);
    font-size:16px;
    font-family:inherit;
  }
  .field input:focus{outline:2px solid var(--eau);outline-offset:-1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .photo-row{display:flex;gap:10px;align-items:center;}
  .photo-btn{
    flex:1;
    border:1px dashed var(--line);
    border-radius:10px;
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:10px;
    text-align:center;
    cursor:pointer;
  }
  .photo-thumb{
    width:44px;height:44px;border-radius:8px;object-fit:cover;
    border:1px solid var(--line);flex-shrink:0;
  }

  button.primary{
    width:100%;
    background:var(--text);
    color:var(--bg);
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    font-weight:650;
    cursor:pointer;
    margin-top:4px;
  }
  button.primary:active{opacity:0.85;}

  .entry{
    border-bottom:1px solid var(--line);
    padding:13px 0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .entry:last-child{border-bottom:none;}
  .entry .date{font-size:13px;color:var(--text-dim);margin-bottom:5px;}
  .entry .vals{font-size:14.5px;}
  .entry .vals .v{margin-right:16px;}
  .entry .delta{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .entry .thumbs{display:flex;gap:6px;}
  .entry .thumbs img{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line);}
  .entry .del{
    background:none;border:none;color:var(--text-dim);font-size:18px;
    padding:2px 4px;cursor:pointer;line-height:1;
  }

  .empty{color:var(--text-dim);font-size:13.5px;text-align:center;padding:20px 0;}

  .chart-wrap{margin-bottom:6px;}
  .chart-legend{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin-bottom:10px;}

  footer{
    text-align:center;font-size:11.5px;color:var(--text-dim);
    padding:20px 20px 0;
  }
</style>
</head>
<body>

<header>
  <h1>Relevés compteurs</h1>
  <div class="sub"><span class="dial elec"></span>Électricité (kWh) &nbsp; <span class="dial eau"></span>Eau (m³)</div>
</header>

<main>

  <div id="banner"></div>

  <div class="card">
    <h2>Nouveau relevé</h2>
    <div class="field">
      <label for="f-date">Date du relevé</label>
      <input type="date" id="f-date">
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-elec">Index électricité (kWh)</label>
        <input type="number" id="f-elec" inputmode="decimal" step="0.01" placeholder="ex. 18452">
      </div>
      <div class="field">
        <label for="f-eau">Index eau (m³)</label>
        <input type="number" id="f-eau" inputmode="decimal" step="0.01" placeholder="ex. 632">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Photo compteur élec</label>
        <div class="photo-row">
          <button class="photo-btn" id="btn-photo-elec">+ Photo</button>
          <img class="photo-thumb" id="thumb-elec" style="display:none">
        </div>
        <input type="file" accept="image/*" capture="environment" id="file-elec" style="display:none">
      </div>
      <div class="field">
        <label>Photo compteur eau</label>
        <div class="photo-row">
          <button class="photo-btn" id="btn-photo-eau">+ Photo</button>
          <img class="photo-thumb" id="thumb-eau" style="display:none">
        </div>
        <input type="file" accept="image/*" capture="environment" id="file-eau" style="display:none">
      </div>
    </div>
    <button class="primary" id="btn-save">Enregistrer le relevé</button>
  </div>

  <div class="card" id="chart-card" style="display:none">
    <h2>Consommation entre relevés</h2>
    <div class="chart-legend">
      <span><span class="dial elec"></span>kWh / période</span>
      <span><span class="dial eau"></span>m³ / période</span>
    </div>
    <div class="chart-wrap" id="chart-elec"></div>
    <div class="chart-wrap" id="chart-eau"></div>
  </div>

  <div class="card">
    <h2>Historique</h2>
    <div id="history"></div>
  </div>

</main>

<footer>Données stockées uniquement sur cet appareil (localStorage). Aucune synchronisation externe.</footer>

<script>
const STORE_KEY = "releves_compteurs_v1";

function loadEntries(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveEntries(list){
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}
let entries = loadEntries();

// ---- date default = today ----
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

// ---- photo capture with compression ----
function wirePhoto(btnId, fileId, thumbId){
  const btn = document.getElementById(btnId);
  const input = document.getElementById(fileId);
  const thumb = document.getElementById(thumbId);
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const file = input.files[0];
    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      thumb.src = dataUrl;
      thumb.style.display = 'block';
      btn.dataset.photo = dataUrl;
    };
    reader.readAsDataURL(file);
  });
}
wirePhoto('btn-photo-elec','file-elec','thumb-elec');
wirePhoto('btn-photo-eau','file-eau','thumb-eau');

// ---- save entry ----
document.getElementById('btn-save').addEventListener('click', () => {
  const date = document.getElementById('f-date').value;
  const elec = document.getElementById('f-elec').value;
  const eau = document.getElementById('f-eau').value;
  if(!date || (elec === "" && eau === "")){
    alert("Indiquez au moins une date et un index (élec ou eau).");
    return;
  }
  const entry = {
    id: Date.now(),
    date,
    elec: elec === "" ? null : parseFloat(elec),
    eau: eau === "" ? null : parseFloat(eau),
    photoElec: document.getElementById('btn-photo-elec').dataset.photo || null,
    photoEau: document.getElementById('btn-photo-eau').dataset.photo || null
  };
  entries.push(entry);
  saveEntries(entries);

  // reset form
  document.getElementById('f-elec').value = "";
  document.getElementById('f-eau').value = "";
  document.getElementById('thumb-elec').style.display = 'none';
  document.getElementById('thumb-eau').style.display = 'none';
  delete document.getElementById('btn-photo-elec').dataset.photo;
  delete document.getElementById('btn-photo-eau').dataset.photo;

  render();
});

// ---- delete entry ----
function deleteEntry(id){
  if(!confirm("Supprimer ce relevé ?")) return;
  entries = entries.filter(e => e.id !== id);
  saveEntries(entries);
  render();
}

// ---- helpers ----
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function sorted(){
  return [...entries].sort((a,b) => a.date.localeCompare(b.date));
}

// ---- reminder banner ----
function renderBanner(){
  const el = document.getElementById('banner');
  const list = sorted();
  if(list.length === 0){
    el.innerHTML = `<div class="banner">Aucun relevé enregistré. Saisissez le premier relevé ci-dessous.</div>`;
    return;
  }
  const last = list[list.length - 1];
  const days = Math.floor((new Date() - new Date(last.date)) / 86400000);
  if(days >= 25){
    el.innerHTML = `<div class="banner">⏱ <span>Dernier relevé le <strong>${fmtDate(last.date)}</strong> (${days} j). Relevé du mois à effectuer.</span></div>`;
  } else {
    el.innerHTML = "";
  }
}

// ---- history + deltas ----
function renderHistory(){
  const list = sorted().slice().reverse();
  const container = document.getElementById('history');
  if(list.length === 0){
    container.innerHTML = `<div class="empty">Aucun relevé pour l'instant.</div>`;
    return;
  }
  const chronological = sorted();
  container.innerHTML = list.map(e => {
    const idx = chronological.findIndex(x => x.id === e.id);
    const prev = idx > 0 ? chronological[idx-1] : null;
    let deltaHtml = "";
    if(prev){
      const days = Math.round((new Date(e.date) - new Date(prev.date)) / 86400000);
      const parts = [];
      if(e.elec != null && prev.elec != null) parts.push(`+${(e.elec - prev.elec).toFixed(1)} kWh`);
      if(e.eau != null && prev.eau != null) parts.push(`+${(e.eau - prev.eau).toFixed(2)} m³`);
      if(parts.length) deltaHtml = `<div class="delta">${parts.join(' · ')} en ${days} j (depuis le ${fmtDate(prev.date)})</div>`;
    }
    const thumbs = [];
    if(e.photoElec) thumbs.push(`<img src="${e.photoElec}" alt="photo élec">`);
    if(e.photoEau) thumbs.push(`<img src="${e.photoEau}" alt="photo eau">`);
    return `
      <div class="entry">
        <div>
          <div class="date">${fmtDate(e.date)}</div>
          <div class="vals mono">
            ${e.elec != null ? `<span class="v"><span class="dial elec"></span>${e.elec}</span>` : ""}
            ${e.eau != null ? `<span class="v"><span class="dial eau"></span>${e.eau}</span>` : ""}
          </div>
          ${deltaHtml}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <button class="del" onclick="deleteEntry(${e.id})">✕</button>
          <div class="thumbs">${thumbs.join('')}</div>
        </div>
      </div>`;
  }).join('');
}

// ---- simple SVG bar chart of period deltas ----
function buildDeltas(key){
  const list = sorted().filter(e => e[key] != null);
  const out = [];
  for(let i = 1; i < list.length; i++){
    const v = list[i][key] - list[i-1][key];
    out.push({ date: list[i].date, value: v });
  }
  return out;
}

function renderChart(containerId, data, color){
  const el = document.getElementById(containerId);
  if(data.length === 0){ el.innerHTML = ""; return; }
  const w = 480, h = 90, pad = 4;
  const max = Math.max(...data.map(d => d.value), 0.0001);
  const barW = (w - pad*2) / data.length;
  const bars = data.map((d,i) => {
    const bh = Math.max(2, (d.value / max) * (h - 20));
    const x = pad + i * barW;
    const y = h - bh - 14;
    return `<rect x="${x + barW*0.15}" y="${y}" width="${barW*0.7}" height="${bh}" rx="2" fill="${color}"></rect>
            <text x="${x + barW*0.5}" y="${h - 2}" font-size="8" fill="var(--text-dim)" text-anchor="middle">${d.date.slice(5)}</text>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${bars}</svg>`;
}

function renderCharts(){
  const dElec = buildDeltas('elec');
  const dEau = buildDeltas('eau');
  const card = document.getElementById('chart-card');
  if(dElec.length === 0 && dEau.length === 0){
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  renderChart('chart-elec', dElec, 'var(--elec)');
  renderChart('chart-eau', dEau, 'var(--eau)');
}

function render(){
  renderBanner();
  renderHistory();
  renderCharts();
}

render();
</script>
</body>
</html>
