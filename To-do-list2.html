*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
h1{font-size:22px;margin:0 0 0 10px;letter-spacing:-.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{flex:none;background:none;border:0;color:var(--text);font-size:26px;line-height:1;padding:4px 6px}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--text);font:600 14px inherit;font-family:inherit;
  padding:8px 4px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg .n{color:var(--muted);font-weight:500;margin-left:4px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px;overflow:hidden}
li{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.front{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  touch-action:pan-y;transition:transform .2s ease;will-change:transform;user-select:none;-webkit-user-select:none}
.front.drag{transition:none}
.star{flex:none;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);opacity:.55;padding:4px 2px}
.star.on{color:#ffcc00;opacity:1}
.swdel{position:absolute;right:0;top:0;bottom:0;width:90px;background:var(--late);color:#fff;border:0;
  font:600 15px -apple-system,sans-serif}
li:last-child{border-bottom:0}
.swrep{position:absolute;left:0;top:0;bottom:0;right:0;display:none;align-items:center;padding-left:16px;background:#3a3a3c;color:#fff;font:600 15px -apple-system,sans-serif}
li.rep .swrep{display:flex}
li.rep .swdel{display:none}
li.rep.ok .swrep{background:#0a84ff}
li.rep.ko .swrep{background:#636366}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:none;
  display:grid;place-items:center;padding:0;color:#fff}
.done .chk{background:var(--ok);border-color:var(--ok)}
.chk svg{width:14px;height:14px;opacity:0}
.done .chk svg{opacity:1}
.body{flex:1;min-width:0}
.t{word-break:break-word;font-size:15px}
.body{cursor:pointer}
.done .t{text-decoration:line-through;color:var(--muted)}
.subs{margin-top:6px}
.sub{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0;cursor:pointer;word-break:break-word}
.sub i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--c);box-sizing:border-box}
.sub.fait i{background:var(--ok);border-color:var(--ok)}
.sub.fait span{text-decoration:line-through;color:var(--muted)}
li .meta span.prog{background:rgba(0,0,0,.28);color:#fff;font-weight:700;font-size:12px;padding:1px 9px;border-radius:9px}
#subSec{display:none}
#subSec.on{display:block}
.subrow{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:15px}
.subrow button{flex:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 8px}
.subrow span{flex:1;word-break:break-word}
.subrow i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);box-sizing:border-box}
.subadd{display:flex;gap:8px}
.subadd input{flex:1}
.subadd button{flex:none;border:0;border-radius:10px;padding:0 16px;font-size:20px;font-weight:700;background:var(--pro);color:#fff}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.tag{font-weight:600;color:#fff;padding:0 8px;border-radius:9px;font-size:12px}
.meta span:not(.tag){color:var(--c)}
.late{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:58px;height:58px;
  border-radius:50%;border:2px solid rgba(255,255,255,.3);background:var(--btn);color:#fff;font-size:34px;line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h2{margin:0 0 12px;font-size:17px;text-align:center}
.field{background:var(--card);border-radius:12px;padding:0 14px;margin-bottom:12px}
.field input[type=text],.field input[type=date]{width:100%;border:0;background:none;color:var(--text);
  font:inherit;padding:13px 0;outline:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.row+.row{border-top:1px solid var(--line)}
.row input[type=checkbox]{width:22px;height:22px}
.actions{display:flex;gap:10px}
.actions button{flex:1;padding:13px;border-radius:12px;border:0;font:600 17px inherit;font-family:inherit}
.cancel{background:var(--seg);color:var(--text)}
.add{background:var(--pro);color:#fff}
.add:disabled{opacity:.4}
.lab{font-size:13px;color:var(--muted);margin:0 4px 6px;text-transform:uppercase;letter-spacing:.3px}
#rubSeg button,#echSeg button{font-size:14px;padding:9px 2px}
#seg button,#segE button,#rubSeg button{font-size:12px;white-space:nowrap;padding-left:1px;padding-right:1px}
#seg button,#segE button{display:flex;flex-direction:column;align-items:center;line-height:1.2}
#seg .n,#segE .n{margin:0;font-size:11px}
#segE button{white-space:normal;font-size:12px}
#seg{margin-bottom:8px}
.sw-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border-radius:12px;padding:10px 14px;gap:14px}
.pop .sw-row{background:none;border-radius:0;margin:0}
.pop .sw-row span:first-child{font-size:16px}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--seg);border-radius:16px;transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(20px)}
.tabs button{font-size:15px!important;padding:9px 4px!important;min-width:0}
.grp{margin:18px 4px 8px;font-size:13px}
.grp .n{color:var(--muted);font-weight:500;margin-left:6px}
#echSeg button{white-space:normal}
.pop{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 56px);background:var(--card);
  border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;z-index:5;min-width:300px}
.pop.open{display:block}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
  font:inherit;padding:13px 16px}
.pop button+button{border-top:1px solid var(--line)}
.pop .danger{color:var(--late)}
#seg{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#seg::-webkit-scrollbar{display:none}
.srow{display:contents}
.vsep{flex:none;width:1px;margin:6px 1px;background:rgba(255,255,255,.45);border-radius:1px}
.srow+.srow{margin-top:2px}
#seg button{flex:1 0 auto;min-width:0;padding:8px 6px;font-size:13px;white-space:nowrap}
#seg .n{font-size:10px;margin-left:2px}
#segE button{flex:1 0 auto;min-width:0;padding:8px 6px;overflow:hidden;text-overflow:ellipsis}
#vueSeg button[data-v=depasse],#vueSeg button[data-v=jour],#vueSeg button[data-v=semaine]{font-weight:800}
#segE{flex-wrap:nowrap;overflow-x:auto;gap:2px;scrollbar-width:none}
#segE::-webkit-scrollbar{display:none}
#segE button{white-space:nowrap}
#echSeg{flex-wrap:wrap;gap:2px}
#echSeg button{min-width:52px}
#rubSeg{flex-wrap:wrap;gap:2px}
.brk{flex-basis:100%;height:0}
.gsep{flex:0 0 1px;background:var(--line);margin:4px 3px}
#rubSeg button{flex:1 1 0;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#rGrp button{font-size:13px}
.brand{flex:none;margin:0}
.brand img{display:block;height:36px;width:auto}
.colrow{background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.colrow .sw-t{font-size:13px;color:var(--muted);margin-bottom:8px}
.colrow .swatches{padding:0;gap:10px}
.colrow .swatch{width:30px;height:30px}
.sheet.scroll{max-height:88vh;overflow-y:auto}
.bkp{position:relative;margin:0 0 10px;z-index:5;display:none;align-items:center;gap:10px;background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 10px 10px 14px;font-size:14px}
.bkp.open{display:flex}
.bkp span{flex:1}
.bkp button{flex:none;border:0;border-radius:10px;background:var(--pro);color:#fff;font:600 14px inherit;font-family:inherit;padding:9px 14px}
.bkp #bkpLater{background:none;color:rgba(255,255,255,.7);font-size:22px;padding:2px 8px}
#secImp{margin-top:14px}
.filebtn{display:block;text-align:center;padding:13px;border-radius:12px;font-weight:600;margin-bottom:10px}
#impTxt{width:100%;min-height:90px;background:var(--card);color:var(--text);border:0;border-radius:12px;padding:10px 12px;font:13px ui-monospace,Menlo,monospace;resize:vertical}
.note{font-size:13px;color:var(--muted);min-height:18px;margin:6px 4px 0}
.del-rub{margin-top:12px;background:none;border:0;color:var(--late);font:inherit;font-size:14px;padding:6px 0}
.danger-btn{background:var(--late);color:#fff}
.colrow .actions button{padding:11px;font-size:15px}
#seg button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.search{display:none;position:fixed;z-index:6;left:16px;right:90px;bottom:calc(env(safe-area-inset-bottom) + 20px);height:58px;margin:0;
  background:var(--btn);border:2px solid rgba(255,255,255,.3);border-radius:29px;padding:0 20px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.search.open{display:flex}
.fab{display:grid;place-items:center;padding:0}
html.kb .search,html.kb .fab{bottom:calc(var(--kb) + 12px)}
html.kb .sheet-bg{bottom:var(--kb)}
html.kbe .search,html.kbe .fab{bottom:calc(var(--kbe) + 12px)}
.search input{flex:1;min-width:0;width:100%;border:0;background:none;color:#fff;font:inherit;font-size:16px;padding:10px 0;outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:4px 4px 4px 14px;margin-bottom:14px}
.quick input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:17px;padding:9px 0;outline:none;-webkit-appearance:none}
.quick input::placeholder{color:var(--muted)}
.quick select{flex:none;max-width:112px;-webkit-appearance:none;appearance:none;border:0;border-radius:16px;padding:8px 12px;font:600 14px inherit;font-family:inherit;color:#fff;text-overflow:ellipsis;text-align:center}
.quick .qrow{flex:1 0 100%;display:flex;gap:8px;padding:0 10px 8px 0}
.quick #qaEch{background:rgba(0,0,0,.28)}
.quick button{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:26px;line-height:1;padding:0}
li.over .t,li.over .meta span:not(.tag){color:#ff7a70}
li.over .front{box-shadow:inset 4px 0 0 #ff453a}
li .meta span.ech:not(.tag){background:rgba(0,0,0,.28);color:#fff;font-weight:700;font-size:12px;padding:1px 9px;border-radius:9px}
li .meta span.ech.ech-j:not(.tag){background:#ff9f0a;color:#1c1c1e}

.esp{margin:0;flex:none;width:auto}
.esp button{flex:none;font-size:12.5px!important;padding:5px 9px!important}
:root{--btn:#494f3b}

<script>
const R = {taches:{label:"RV",color:"#ff9500"}, ga:{label:"GA",color:"#af52de"}, equipe:{label:"GC",color:"#ff2d55"}, br:{label:"BR",color:"#30b0c7"}, bo:{label:"BO",color:"#5856d6"}, wg:{label:"WG",color:"#a2845e"}, bu:{label:"BU",color:"#32ade6"}, ma:{label:"MA",color:"#c0507a"}, todo:{label:"ToDo",color:"#ff9500"}, maison:{label:"Maison",color:"#00a88f"}, courses:{label:"Courses",color:"#e0a800"}, enfants:{label:"Enfants",color:"#30b0c7"}};
const GR = {pro:[["taches","wg","equipe","ga","br"],["bo","ma","bu"]], perso:[["todo","maison","courses","enfants"]]};
let esp = "pro";
let GROUPES = GR.pro;
const defRub = () => esp==="perso" ? "todo" : "taches";
const PALETTE_BASE = ["#0a84ff","#00a88f","#ff9500","#ff2d55","#af52de","#30b0c7","#5856d6","#a2845e","#32ade6","#e0a800"];
// couleur spécifique à chaque espace : vert olive foncé = Pro uniquement, bleu nuit = Perso uniquement
const palette = () => [...PALETTE_BASE, esp==="perso" ? "#1c2951" : "#494f3b"];
const CADRES = {"#494f3b":"#6f7759", "#1c2951":"#2c3e70"};   // couleurs sombres : liseré clair quand sélectionnées
const cadre = c => CADRES[String(c).toLowerCase()] ? `box-shadow:inset 0 0 0 2px ${CADRES[String(c).toLowerCase()]};` : "";
const BASE_KEYS = Object.keys(R);
const BASE_COLORS = Object.fromEntries(BASE_KEYS.map(k=>[k,R[k].color]));
const BASE_GR = {pro:GR.pro.map(g=>[...g]), perso:GR.perso.map(g=>[...g])};
const BASE_DEFS = JSON.parse(JSON.stringify(R));
let supprimees = [], confSuppr = false;
const groupesVisibles = () => GROUPES.filter(g=>g.length);
function retirerDuModele(k){ delete R[k]; Object.values(GR).forEach(gs=>gs.forEach(g=>{ const i=g.indexOf(k); if(i>=0) g.splice(i,1); })); }
function chargerSupprimees(){ try{ supprimees = JSON.parse(localStorage.getItem("supprimees-v1")||"[]"); }catch(e){ supprimees=[]; } supprimees.forEach(retirerDuModele); }
function sauverSupprimees(){ try{ localStorage.setItem("supprimees-v1", JSON.stringify(supprimees)); }catch(e){} }
let custom = [];
function appliquerRub(c){ R[c.key]={label:c.label,color:c.color}; const G=GR[c.esp==="perso"?"perso":"pro"]; while(G.length<=c.g) G.push([]); G[c.g].push(c.key); }
function chargerRub(){ try{ custom = JSON.parse(localStorage.getItem("rubriques-v1")||"[]"); }catch(e){ custom=[]; } custom.forEach(appliquerRub); }
let couleurs = {};
function chargerCouleurs(){ try{ couleurs = JSON.parse(localStorage.getItem("couleurs-v1")||"{}"); }catch(e){ couleurs={}; } Object.entries(couleurs).forEach(([k,c])=>{ if(R[k]) R[k].color=c; }); }
function changerCouleur(k,c){ R[k].color=c; couleurs[k]=c; try{ localStorage.setItem("couleurs-v1", JSON.stringify(couleurs)); }catch(e){} }
function sauverRub(){ try{ localStorage.setItem("rubriques-v1", JSON.stringify(custom)); }catch(e){} }
const E = {j:{label:"J",ordre:1}, semaine:{label:"S",ordre:7}, prochaine:{label:"S+1",ordre:14}, pense:{label:"Mémo",ordre:1e6}};
const BASE_E = Object.keys(E);
let echCustom = [];                    // [{key,label,u:"j"|"s"|"m",n}] : J+n, S+n, M+n
const ordreDef = (u,n) => u==="j" ? n+1 : u==="s" ? (n+1)*7 : (n+1)*30;
const validEch = c => !!c && typeof c.key==="string" && /^[\w-]{1,40}$/.test(c.key) && !BASE_E.includes(c.key) && typeof c.label==="string" && !!c.label.trim()
  && ["j","s","m"].includes(c.u) && Number.isInteger(c.n) && c.n>=0 && c.n<=60;
const appliquerEch = c => { E[c.key] = {label:c.label, ordre:ordreDef(c.u,c.n), def:{u:c.u,n:c.n}, esp:c.esp}; };
const grpEch = k => k==="j" ? "j" : (k==="semaine"||k==="prochaine") ? "s" : k==="pense" ? "p" : (E[k] && E[k].def ? E[k].def.u : "x");
const sepEch = (liste, i) => (i>0 && grpEch(liste[i])!==grpEch(liste[i-1])) ? '<span class="vsep"></span>' : "";
const clesEch = () => Object.keys(E).filter(k=>!E[k].esp || E[k].esp===esp).sort((a,b)=>E[a].ordre-E[b].ordre);
function chargerEchCustom(){ try{ const a=JSON.parse(localStorage.getItem("echeances-v1")||"[]"); echCustom=Array.isArray(a)?a.filter(validEch).map(c=>({key:c.key,label:c.label.trim().slice(0,6),u:c.u,n:c.n,auto:!!c.auto,esp:(c.esp==="pro"||c.esp==="perso")?c.esp:undefined})):[]; }catch(e){ echCustom=[]; } echCustom.forEach(appliquerEch); }
function sauverEchCustom(){ try{ localStorage.setItem("echeances-v1", JSON.stringify(echCustom)); }catch(e){} }
let couleursEch = {};
function chargerCouleursEch(){ try{ couleursEch = JSON.parse(localStorage.getItem("couleurs-ech-v1")||"{}"); }catch(e){ couleursEch={}; } if(!couleursEch||typeof couleursEch!=="object") couleursEch={}; }
function sauverCouleursEch(){ try{ localStorage.setItem("couleurs-ech-v1", JSON.stringify(couleursEch)); }catch(e){} }
const contraste = hex => { const n=parseInt(String(hex).slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255; return (0.299*r+0.587*g+0.114*b)>150 ? "#1c1c1e" : "#fff"; };
const styleEch = k => couleursEch[k] ? `background:${couleursEch[k]};color:${contraste(couleursEch[k])};` : "";
const KEY = "taches-v2", KEY_PERSO = "taches-perso-v1";
let store = {pro:[], perso:[]};
let q = "";
const norm = x => String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let taches = [], filtre = "toutes", fEch = "toutes", masquer = false, vue = "toutes", rub = "taches", ech = "pense";

function normaliser(list, sp){
  let modifie=false; const valides=new Set(GR[sp].flat()); const def = sp==="perso" ? "todo" : "taches";
  list.forEach(t=>{
    if(!valides.has(t.rub)){ t.rub=def; modifie=true; }
    if(t.ech==="weekend"||t.ech==="s2"){ t.ech="prochaine"; modifie=true; }
    if(!E[t.ech]){ t.ech="pense"; modifie=true; }
    if(!Number.isFinite(t.ref)){ t.ref = (Number.isFinite(t.id)&&t.id>1e12) ? t.id : Date.now(); modifie=true; }
  });
  return modifie;
}
function charger(){
  let pro=null, perso=[];
  try{
    pro = JSON.parse(localStorage.getItem(KEY)||"null");
    if(!pro){ const old = JSON.parse(localStorage.getItem("taches-v1")||"[]"); pro = old.map(t=>({id:t.id,titre:t.titre,rub:"taches",done:t.done,ech:"pense"})); }
  }catch(e){ pro=[]; }
  try{ perso = JSON.parse(localStorage.getItem(KEY_PERSO)||"[]"); }catch(e){ perso=[]; }
  if(!Array.isArray(pro)) pro=[]; if(!Array.isArray(perso)) perso=[];
  try{ const e=localStorage.getItem("espace-v1"); if(e==="perso"||e==="pro") esp=e; }catch(_){}
  const m1=normaliser(pro,"pro"), m2=normaliser(perso,"perso");
  store={pro,perso}; taches=store[esp]; GROUPES=GR[esp]; rub=defRub(); qRub=defRub();
  appliquerTheme();
  if(m1||m2) sauver();
}
function sauver(){ store[esp]=taches; try{ localStorage.setItem(KEY, JSON.stringify(store.pro)); localStorage.setItem(KEY_PERSO, JSON.stringify(store.perso)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nOpen = r => taches.filter(t=>t.rub===r && !t.done && (fEch==="toutes"||t.ech===fEch)).length;
const nOpenE = e => taches.filter(t=>t.ech===e && !t.done && (filtre==="toutes"||t.rub===filtre)).length;

function ligne(t, afficherTag){
  const sub = esp==="perso" && Array.isArray(t.sub) ? t.sub : [];
  const nf = sub.filter(x=>x.done).length;
  return `<li class="${t.done?"done":""}${depasse(t)?" over":""}" style="--c:${R[t.rub].color}" data-id="${t.id}">
      <button class="swdel" data-del="${t.id}">Supprimer</button><div class="swrep"></div>
      <div class="front"><button class="chk" data-id="${t.id}" aria-label="Terminer"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5l3.2 3.2L12 3.5"/></svg></button>
      <div class="body"><div class="t">${esc(t.titre)}</div>
        <div class="meta">${afficherTag?`<span class="tag" style="background:${R[t.rub].color}">${R[t.rub].label}</span>`:""}
        <span class="ech ${depasse(t)?"ech-r":(t.ech==="j"&&!t.done?"ech-j":"")}" style="${depasse(t)?"":styleEch(t.ech)}">${E[t.ech].label}${depasse(t)?" · retard":""}</span>${sub.length?`<span class="prog">${nf}/${sub.length}</span>`:""}</div>${sub.length?`<div class="subs">${sub.map(x=>`<div class="sub ${x.done?"fait":""}" data-sub="${x.id}" data-t="${t.id}"><i></i><span>${esc(x.titre)}</span></div>`).join("")}</div>`:""}</div>
      <button class="star ${t.fav?"on":""}" data-star="${t.id}" aria-label="Favori">${t.fav?"★":"☆"}</button></div></li>`;
}
// ---- Échéances relatives : J = jour de saisie, S = semaine de saisie, S+1 = semaine suivante (semaine lun.–dim.) ----
const debutJour = ms => { const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const debutSemaine = ms => { const d=new Date(debutJour(ms)); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); };
const plusJours = (ms,n) => { const d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); };
function echeanceFin(t){            // fin de la période d'échéance (ms), null pour « Mémo »
  const ref = t.ref || t.id;
  if(t.ech==="j") return plusJours(debutJour(ref),1);
  if(t.ech==="semaine") return plusJours(debutSemaine(ref),7);
  if(t.ech==="prochaine") return plusJours(debutSemaine(ref),14);
  const d = E[t.ech] && E[t.ech].def;
  if(d){
    if(d.u==="j") return plusJours(debutJour(ref), d.n+1);
    if(d.u==="s") return plusJours(debutSemaine(ref), (d.n+1)*7);
    const x=new Date(ref); return new Date(x.getFullYear(), x.getMonth()+d.n+1, 1).getTime();
  }
  return null;
}
const depasse = t => { if(t.done) return false; const f=echeanceFin(t); return f!==null && Date.now()>=f; };
const duJour = t => { if(t.done || depasse(t)) return false; const f=echeanceFin(t); return f!==null && f<=plusJours(debutJour(Date.now()),1); };   // échéance : aujourd'hui
const cetteSemaine = t => { if(t.done || depasse(t)) return false; const f=echeanceFin(t); return f!==null && f<=plusJours(debutSemaine(Date.now()),7); };

const SEP_AVANT = ["wg","ga"];   // traits verticaux identiques avant WG (après RV) et avant GA (après GC) ; un trait identique sépare aussi les deux catégories
function render(){
  ouvert=null; if(typeof styleQaEch==="function" && $("qaEch").options.length) styleQaEch();
  $("espSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.s===esp));
  const estFav = t => !!t.fav && !t.done;
  const nD = taches.filter(depasse).length, nJ = taches.filter(duJour).length, nS = taches.filter(cetteSemaine).length, nF = taches.filter(estFav).length;
  $("vueSeg").innerHTML = `<button data-v="depasse" class="${vue==="depasse"?"on":""}">Retard${nD?` (${nD})`:""}</button><button data-v="jour" class="${vue==="jour"?"on":""}">J${nJ?` (${nJ})`:""}</button><button data-v="semaine" class="${vue==="semaine"?"on":""}">S${nS?` (${nS})`:""}</button><button data-v="favoris" class="${vue==="favoris"?"on":""}">★${nF?` (${nF})`:""}</button><button data-v="toutes" class="${vue==="toutes"?"on":""}">Tous</button>`;
  const rech = q.trim();
  $("filtres").style.display = vue==="toutes" && !rech ? "" : "none";
  if(rech){
    const n = norm(rech);
    const l = taches.filter(t=>norm(t.titre).includes(n) || (R[t.rub]&&norm(R[t.rub].label).includes(n)))
      .sort((a,b)=> ((b.fav?1:0)-(a.fav?1:0)) || (a.done-b.done) || (E[a.ech].ordre-E[b.ech].ordre) || (b.id-a.id));
    $("list").innerHTML = l.length ? `<div class="note" style="margin:0 4px 8px">${l.length} résultat${l.length>1?"s":""}</div><ul>${l.map(t=>ligne(t,true)).join("")}</ul>`
      : `<div class="empty">Aucun résultat pour « ${esc(rech)} ».</div>`;
    return;
  }

  if(vue==="depasse" || vue==="jour" || vue==="semaine" || vue==="favoris"){
    const l = taches.filter(vue==="depasse" ? depasse : vue==="favoris" ? estFav : vue==="jour" ? duJour : cetteSemaine);
    if(!l.length){ $("list").innerHTML = `<div class="empty">${vue==="depasse" ? "Aucune tâche en retard." : vue==="favoris" ? "Aucun favori. Touchez l'étoile d'une tâche pour l'ajouter." : vue==="jour" ? "Rien pour aujourd'hui." : "Rien cette semaine."}</div>`; return; }
    const ordre = vue==="depasse" ? (a,b)=>echeanceFin(a)-echeanceFin(b) : (a,b)=>E[a.ech].ordre-E[b.ech].ordre;
    $("list").innerHTML = GROUPES.flat().map(r=>{
      const g = l.filter(t=>t.rub===r).sort((a,b)=>((b.fav?1:0)-(a.fav?1:0)) || ordre(a,b) || (b.id-a.id));
      if(!g.length) return "";
      return `<div class="grp"><span class="tag" style="background:${R[r].color};font-size:13px;padding:2px 10px">${R[r].label}</span><span class="n">${g.length}</span></div><ul>${g.map(t=>ligne(t,false)).join("")}</ul>`;
    }).join("");
    return;
  }

  const bf = f => `<button data-f="${f}" class="${filtre===f?"on":""}" ${filtre===f&&f!=="toutes"?`style="background:${R[f].color};color:#fff;${cadre(R[f].color)}"`:""}>${f==="toutes" ? "Toutes" : `${R[f].label}<span class="n">${nOpen(f)}</span>`}</button>`;
  $("seg").innerHTML = groupesVisibles().map((g,i)=>`<div class="srow">${i>0?'<span class="vsep g"></span>':""}${i===0?bf("toutes"):""}${g.map((f,j)=>(esp==="pro"&&j>0&&SEP_AVANT.includes(f)?'<span class="vsep"></span>':"")+bf(f)).join("")}</div>`).join("");
  const lEch = clesEch();
  $("segE").innerHTML = ["toutes",...lEch].map((f,i0)=>{
    const sp = i0>1 ? sepEch(lEch, i0-1) : "";
    const lab = f==="toutes" ? "Toutes" : `${E[f].label}<span class="n">${nOpenE(f)}</span>`;
    const st = fEch===f && f!=="toutes" && couleursEch[f] ? ` style="${styleEch(f)}${cadre(couleursEch[f])}"` : "";
    return `${sp}<button data-e="${f}" class="${fEch===f?"on":""}"${st}>${lab}</button>`;
  }).join("");
  $("colEdit").style.display="none"; $("colEdit").innerHTML="";
  let l = taches.filter(t => (filtre==="toutes"||t.rub===filtre) && (fEch==="toutes"||t.ech===fEch) && !(masquer&&t.done));
  l = l.slice().sort((a,b)=> ((b.fav?1:0)-(a.fav?1:0)) || (a.done-b.done) || (E[a.ech].ordre-E[b.ech].ordre) || (b.id-a.id));
  if(!l.length){ $("list").innerHTML = `<div class="empty">Aucune tâche.<br>Ajoutez-en une avec le champ ci-dessus.</div>`; return; }
  $("list").innerHTML = "<ul>" + l.map(t=>ligne(t, filtre==="toutes")).join("") + "</ul>";
}

$("q").addEventListener("input", e=>{ q=e.target.value; render(); });
$("vueSeg").onclick = e => { const b=e.target.closest("button"); if(b){ vue=b.dataset.v; render(); } };
$("seg").onclick = e => { const b=e.target.closest("button"); if(b){ if(lpFait){ lpFait=false; return; } filtre=b.dataset.f; if(filtre!=="toutes" && R[filtre]){ qRub=filtre; majQaRub(); } confSuppr=false; render(); } };
const nTaches = k => taches.filter(t=>t.rub===k).length;
function supprimerRub(k){
  taches.forEach(t=>{ if(t.rub===k) t.rub=defRub(); });
  custom = custom.filter(c=>c.key!==k); sauverRub();
  if(BASE_KEYS.includes(k)){ supprimees.push(k); sauverSupprimees(); }
  retirerDuModele(k); delete couleurs[k]; try{ localStorage.setItem("couleurs-v1", JSON.stringify(couleurs)); }catch(e){}
  sauver(); filtre="toutes"; confSuppr=false; majRubSeg(); render();
}
$("segE").onclick = e => { const b=e.target.closest("button"); if(b){ if(lpFait){ lpFait=false; return; } fEch=b.dataset.e; if(fEch!=="toutes" && E[fEch]){ qEch=fEch; majQaEch(); } render(); } };
let sw=null, ouvert=null, ignorerClic=false;
function fermerOuvert(sauf){ if(ouvert&&ouvert!==sauf){ ouvert.style.transform=""; ouvert=null; } }
const SEUIL_REP = 80, LIM_REP = {j:30, s:12, m:12}, UNITE_REP = {j:"jour", s:"semaine", m:"mois"};
const labelCible = (u,n) => (u==="j"&&n===0) ? "J" : (u==="s"&&n===0) ? "S" : (u==="s"&&n===1) ? "S+1"
  : (echCustom.find(x=>x.u===u&&x.n===n) || {label:nomAuto(u,n)}).label;
// Report (balayage à droite) : J → J+1 → J+2 → S → S+1 → S+2 → Mémo ; en mois : M → M+1…
// Une tâche en retard revient dans la période en cours (J, S ou M).
function cibleReport(t){
  if(!t || t.done) return null;
  const ty = typeEch(t.ech); if(!ty) return null;
  const retard = depasse(t);
  let u = ty.u, n, txt = "";
  if(retard) n = 0;
  else if(u==="j" && ty.n>=2){ u="s"; n=0; }
  else if(u==="s" && ty.n>=2) return {cle:"pense", label:"Mémo", txt:""};
  else { n = ty.n+1; txt = ` (+1 ${UNITE_REP[u]})`; }
  if(n > LIM_REP[u]) return null;
  return {u, n, label:labelCible(u,n), txt};
}
function majRep(li, cur){
  const t=taches.find(x=>x.id==li.dataset.id), c=cibleReport(t), pret = cur>=SEUIL_REP;
  li.classList.add("rep"); li.classList.toggle("ok", !!c && pret); li.classList.toggle("ko", !c);
  li.querySelector(".swrep").textContent = !c ? `${t&&t.done?"Terminée":E[t.ech].label} : pas de report` : (pret ? `Relâcher → ${c.label}${c.txt}` : `Reporter → ${c.label}${c.txt}`);
}
function effacer(id){ taches=taches.filter(x=>x.id!=id); sauver(); render(); }
$("list").addEventListener("pointerdown", e=>{
  const f=e.target.closest(".front");
  if(!f){ if(!e.target.closest(".swdel")) fermerOuvert(); return; }
  fermerOuvert(f);
  sw={f,x:e.clientX,y:e.clientY,base:f===ouvert?-90:0,horiz:null,cur:0,id:e.pointerId};
});
$("list").addEventListener("pointermove", e=>{
  if(!sw||e.pointerId!==sw.id) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(sw.horiz===null){
    if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
    sw.horiz = Math.abs(dx)>Math.abs(dy);
    if(!sw.horiz){ sw=null; return; }
    try{ sw.f.setPointerCapture(e.pointerId); }catch(_){}
    sw.f.classList.add("drag");
  }
  sw.cur = Math.max(-window.innerWidth, Math.min(window.innerWidth, sw.base+dx));
  sw.f.style.transform = `translateX(${sw.cur}px)`;
  const li=sw.f.parentNode; if(sw.cur>0) majRep(li, sw.cur); else li.classList.remove("rep","ok","ko");
});
function finGeste(e){
  if(!sw||e.pointerId!==sw.id) return;
  const s=sw; sw=null;
  if(!s.horiz) return;
  s.f.classList.remove("drag");
  ignorerClic=true; setTimeout(()=>ignorerClic=false,60);
  if(s.cur>0){
    const li=s.f.parentNode, t=taches.find(x=>x.id==li.dataset.id), c=cibleReport(t);
    if(c && s.cur>=SEUIL_REP){
      const k = c.cle || cleEch(c.u, c.n);
      if(k){ t.ech=k; t.ref=Date.now(); sauver(); majEchSeg(); majQaEch(); render(); return; }
    }
    s.f.style.transform=""; if(ouvert===s.f) ouvert=null;
    setTimeout(()=>li.classList.remove("rep","ok","ko"),200); return;
  }
  if(s.cur < -Math.min(170, window.innerWidth*0.45)){
    s.f.style.transform="translateX(-110%)";
    const id=s.f.parentNode.dataset.id; setTimeout(()=>effacer(id),180);
  } else if(s.cur < -45){
    s.f.style.transform="translateX(-90px)"; ouvert=s.f;
  } else {
    s.f.style.transform=""; if(ouvert===s.f) ouvert=null;
  }
}
$("list").addEventListener("pointerup", finGeste);
$("list").addEventListener("pointercancel", finGeste);
$("list").onclick = e => {
  if(ignorerClic) return;
  if(e.target.closest(".front")===ouvert && ouvert){ fermerOuvert(); return; }
  const sb=e.target.closest(".sub");
  if(sb){ const t=taches.find(x=>x.id==sb.dataset.t), u=t&&(t.sub||[]).find(x=>x.id==sb.dataset.sub); if(u){ u.done=!u.done; sauver(); render(); } return; }
  const corps=e.target.closest(".body");
  if(corps){ const t=taches.find(x=>x.id==corps.closest("li").dataset.id); if(t) ouvrirForm(t); return; }
  const c=e.target.closest(".chk"), d=e.target.closest(".swdel"), st=e.target.closest(".star");
  if(c){ const t=taches.find(x=>x.id==c.dataset.id); t.done=!t.done; sauver(); render(); }
  if(d){ effacer(d.dataset.del); }
  if(st){ const t=taches.find(x=>x.id==st.dataset.star); t.fav=!t.fav; sauver(); render(); }
};

// ---------- Clavier : la barre de recherche et les fenêtres remontent au-dessus ----------
function ajusterClavier(){
  const v = window.visualViewport; if(!v) return;
  const kb = Math.max(0, Math.round(window.innerHeight - v.height - v.offsetTop));
  document.documentElement.style.setProperty("--kb", kb + "px");
  document.documentElement.classList.toggle("kb", kb > 80);
}
if(window.visualViewport){ visualViewport.addEventListener("resize", ajusterClavier); visualViewport.addEventListener("scroll", ajusterClavier); }
// Repli : si ni la taille de la fenêtre ni le viewport visuel ne signalent le clavier (cas fréquent dans une page intégrée sur iPhone),
// on remonte la barre d'une hauteur de clavier estimée.
$("q").addEventListener("focus", () => {
  const base = window.innerHeight;
  setTimeout(() => {
    if(document.activeElement !== $("q")) return;
    const signale = window.innerHeight < base - 100 || document.documentElement.classList.contains("kb");
    if(signale) return;
    const est = Math.round(Math.min(350, Math.max(250, (screen.height||700) * 0.39)));
    document.documentElement.style.setProperty("--kbe", est + "px");
    document.documentElement.classList.add("kbe");
  }, 400);
});
$("q").addEventListener("blur", () => { document.documentElement.classList.remove("kbe"); setTimeout(ajusterClavier, 100); });

// ---------- Échéances par défaut de l'espace Pro : J+1, J+2, S+2 (créées une seule fois, supprimables) ----------
const DEFAUTS_ECH = [["dj1","J+1","j",1],["dj2","J+2","j",2],["ds2","S+2","s",2]];
function assurerDefauts(){
  let faits = [];
  try{ const v = localStorage.getItem("echeances-defaut-v1"); faits = v==="1" ? ["dj1","dj2"] : (v ? JSON.parse(v) : []); }catch(e){ faits = []; }
  if(!Array.isArray(faits)) faits = [];
  let modif = false;
  DEFAUTS_ECH.forEach(([key,label,u,n])=>{
    if(faits.includes(key)) return;
    faits.push(key); modif = true;
    const ex = echCustom.find(c=>c.u===u && c.n===n);
    if(ex){ if(ex.auto){ ex.auto=false; ex.esp="pro"; appliquerEch(ex); } return; }
    const c = {key, label, u, n, auto:false, esp:"pro"};
    echCustom.push(c); appliquerEch(c);
  });
  if(modif){ sauverEchCustom(); try{ localStorage.setItem("echeances-defaut-v1", JSON.stringify(faits)); }catch(e){} }
}

// ---------- Les échéances avancent avec le temps ----------
// J+1 devient J le lendemain ; S+1 devient S le lundi ; S+2 devient S+1 ; M+1 devient M au changement de mois.
// La date butoir ne change pas : seule l'étiquette (et la référence de calcul) est mise à jour.
function typeEch(k){
  if(k==="j") return {u:"j",n:0};
  if(k==="semaine") return {u:"s",n:0};
  if(k==="prochaine") return {u:"s",n:1};
  const d = E[k] && E[k].def; return d ? {u:d.u,n:d.n} : null;
}
function cleEch(u,n,sp){
  sp = sp || esp;
  if(u==="j" && n===0) return "j";
  if(u==="s" && n===0) return "semaine";
  if(u==="s" && n===1) return "prochaine";
  const ex = echCustom.find(x=>x.u===u && x.n===n && (!x.esp || x.esp===sp)); if(ex) return ex.key;
  const label = nomAuto(u,n);
  if(Object.values(E).some(x=>x.label.toLowerCase()===label.toLowerCase())) return null;
  const c = {key:"a"+u+n, label, u, n, auto:true};
  echCustom.push(c); appliquerEch(c); return c.key;
}
function avancerEch(){
  const now = Date.now(); let modif = false;
  [["pro",store.pro],["perso",store.perso]].forEach(([sp,l])=>l.forEach(t=>{
    if(t.done) return;
    const f = echeanceFin(t); if(f===null || f<=now) return;
    const ty = typeEch(t.ech); if(!ty) return;
    let n;
    if(ty.u==="j") n = Math.round((debutJour(f-1)-debutJour(now))/864e5);
    else if(ty.u==="s") n = Math.round((debutSemaine(f-1)-debutSemaine(now))/(7*864e5));
    else { const a=new Date(f-1), b=new Date(now); n=(a.getFullYear()-b.getFullYear())*12+a.getMonth()-b.getMonth(); }
    if(!(n>=0 && n<ty.n)) return;
    const k = cleEch(ty.u,n,sp); if(!k || k===t.ech) return;
    t.ech = k; t.ref = now; modif = true;
  }));
  const utilisees = new Set([...store.pro,...store.perso].map(t=>t.ech));
  const sup = echCustom.filter(c=>c.auto && !utilisees.has(c.key) && !couleursEch[c.key] && c.key!==qEch && c.key!==fEch);
  if(sup.length){ sup.forEach(c=>delete E[c.key]); echCustom = echCustom.filter(c=>!sup.includes(c)); modif = true; }
  if(modif){ sauverEchCustom(); sauver(); }
  return modif;
}
function rafraichirEch(){ if(avancerEch()){ majEchSeg(); majQaEch(); } render(); }
let jourVu = debutJour(Date.now());
setInterval(()=>{ if(debutJour(Date.now())!==jourVu){ jourVu=debutJour(Date.now()); rafraichirEch(); } }, 60000);

const E_LIM = {j:[1,30], s:[2,12], m:[0,12]};
let eU="s", eN=2, eAuto=true;
const nomAuto = (u,n) => u==="m" ? (n===0?"M":`M+${n}`) : `${u==="j"?"J":"S"}+${n}`;
function descEch(u,n){
  return u==="j" ? `Fin du jour J+${n} (${n} jour${n>1?"s":""} après la saisie).`
    : u==="s" ? `Fin de la semaine S+${n} (semaine du lundi au dimanche, ${n} semaine${n>1?"s":""} après celle de la saisie).`
    : n===0 ? "Fin du mois de la saisie." : `Fin du mois M+${n} (${n} mois après celui de la saisie).`;
}

$("formE").onsubmit = e => {

function supprimerEch(k){
  [store.pro, store.perso].forEach(l=>l.forEach(t=>{ if(t.ech===k){ t.ech="pense"; } }));
  echCustom = echCustom.filter(c=>c.key!==k); sauverEchCustom(); delete E[k];

  sauver(); majEchSeg(); majQaEch(); render();

// ---------- Sauvegarde hebdomadaire ----------
const SEMAINE_MS = 7*864e5;
let auto = {on:false, last:0}, bkpReporte = false;
function chargerAuto(){ try{ const a=JSON.parse(localStorage.getItem("autosave-v1")||"{}"); auto={on:!!a.on, last:Number.isFinite(a.last)?a.last:0}; }catch(e){ auto={on:false,last:0}; } }
function sauverAuto(){ try{ localStorage.setItem("autosave-v1", JSON.stringify(auto)); }catch(e){} }
const fmtDate = ms => { const d=new Date(ms), p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`; };
function majAuto(){
  $("autoSave").checked = auto.on;
  $("autoInfo").textContent = !auto.on ? "" : auto.last ? `Dernière : ${fmtDate(auto.last)} · prochaine : ${fmtDate(auto.last+SEMAINE_MS)}` : "Aucune sauvegarde faite";
  const due = auto.on && Date.now()-auto.last >= SEMAINE_MS;
  $("bkpTxt").textContent = auto.last ? `Sauvegarde hebdomadaire : dernière le ${fmtDate(auto.last)}.` : "Sauvegarde hebdomadaire : aucune sauvegarde faite.";
  $("bkp").classList.toggle("open", due && !bkpReporte);
}
$("swAuto").onclick = e => e.stopPropagation();
$("autoSave").onchange = () => { auto.on=$("autoSave").checked; bkpReporte=false; sauverAuto(); majAuto(); };
$("bkpLater").onclick = () => { bkpReporte=true; majAuto(); };
$("bkpGo").onclick = async () => {
  const r = await exporterFichier();
  if(r==="ok"){ auto.last=Date.now(); sauverAuto(); }
  else { $("bkpTxt").textContent = r==="annule" ? "Sauvegarde annulée : elle reste à faire." : "Sauvegarde impossible ici : utilisez Options → Exporter."; return; }
  majAuto();
};
document.addEventListener("visibilitychange", () => { if(!document.hidden) majAuto(); });

// ---------- Sauvegarde : export / import ----------
function donnees(){ store[esp]=taches; return {app:"todo-list", version:2, exportedAt:new Date().toISOString(), taches:store.pro, perso:store.perso, rubriques:custom, couleurs, couleursEch, echeances:echCustom, supprimees}; }
function nomFichier(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `todo-list-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`; }
let dlCap = null;
(async()=>{ try{ if(typeof claude!=="undefined" && claude.use) dlCap = await claude.use("downloads"); }catch(e){} })();
const msgE = t => $("expMsg").textContent = t;
const msgI = t => $("impMsg").textContent = t;
let pending = null;

function ouvrirSauv(mode){
  msgE(""); msgI(""); $("impTxt").value=""; pending=null; $("impGo").disabled=true;
  $("sTitre").textContent = mode==="exp" ? "Exporter" : "Importer";
  $("secExp").style.display = mode==="exp" ? "" : "none";
  $("secImp").style.display = mode==="imp" ? "" : "none";
  $("impGo").style.display = mode==="imp" ? "" : "none";
  $("secImp").style.marginTop = "0";
  $("bgS").classList.add("open");
}
$("openExp").onclick = () => ouvrirSauv("exp");
$("openImp").onclick = () => ouvrirSauv("imp");
$("sClose").onclick = () => $("bgS").classList.remove("open");
$("bgS").onclick = e => { if(e.target===$("bgS")) $("bgS").classList.remove("open"); };

async function exporterFichier(){      // "ok" | "annule" | "echec"
  const json = JSON.stringify(donnees(), null, 2);
  try{
    if(dlCap){ await dlCap.save({filename:nomFichier(), data:json}); return "ok"; }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download=nomFichier();
    document.body.appendChild(a); a.click(); a.remove();
    return "ok";
  }catch(e){ return e && e.code==="declined" ? "annule" : "echec"; }
}
$("expFile").onclick = async () => {
  const r = await exporterFichier();
  if(r==="ok"){ auto.last=Date.now(); sauverAuto(); majAuto(); msgE(dlCap ? "Fichier prêt." : "Export lancé. Si rien ne se télécharge, utilisez « Copier »."); }
  else msgE(r==="annule" ? "Export annulé." : "Export impossible ici : utilisez « Copier ».");
};
$("expCopy").onclick = async () => {
  const json = JSON.stringify(donnees(), null, 2);
  try{ await navigator.clipboard.writeText(json); msgE("Données copiées dans le presse-papiers."); }
  catch(e){ $("impTxt").value=json; $("impTxt").focus(); $("impTxt").select(); pending=null; $("impGo").disabled=true;
    msgE("Copie bloquée : le texte est dans la zone ci-dessous, copiez-le à la main."); msgI(""); }
};

function nettoyer(d){
  if(!d || typeof d!=="object" || !Array.isArray(d.taches)) throw new Error("format");
  const hex=/^#[0-9a-fA-F]{6}$/;
  const rubs=(Array.isArray(d.rubriques)?d.rubriques:[]).filter(c=>c && typeof c.key==="string" && /^[\w-]{1,40}$/.test(c.key) && !BASE_KEYS.includes(c.key)
      && typeof c.label==="string" && c.label.trim() && hex.test(c.color) && Number.isInteger(c.g) && c.g>=0 && c.g<10)
    .map(c=>({key:c.key,label:c.label.trim().slice(0,12),color:c.color,g:c.g,esp:c.esp==="perso"?"perso":"pro"}));
  const ech=(Array.isArray(d.echeances)?d.echeances:[]).filter(validEch).slice(0,40).map(c=>({key:c.key,label:c.label.trim().slice(0,6),u:c.u,n:c.n,auto:!!c.auto,esp:(c.esp==="pro"||c.esp==="perso")?c.esp:undefined}));
  const okE = k => BASE_E.includes(k) || ech.some(c=>c.key===k);
  let ce=null; if(d.couleursEch && typeof d.couleursEch==="object"){ ce={}; for(const [k,v] of Object.entries(d.couleursEch)) if(okE(k) && hex.test(v)) ce[k]=v; }
  const cou={}; if(d.couleurs && typeof d.couleurs==="object") for(const [k,v] of Object.entries(d.couleurs)) if(hex.test(v)) cou[k]=v;
  const nettS = a => Array.isArray(a) ? a.filter(x=>x && typeof x.titre==="string" && x.titre.trim()).slice(0,50).map((x,i)=>({id:Number.isFinite(x.id)?x.id:Date.now()+i, titre:x.titre.trim().slice(0,300), done:!!x.done})) : [];
  const nettT = (arr, perso) => arr.filter(t=>t && typeof t.titre==="string" && t.titre.trim())
    .map((t,i)=>({id:Number.isFinite(t.id)?t.id:Date.now()+i, titre:t.titre.trim().slice(0,500), rub:typeof t.rub==="string"?t.rub:"taches", ref:Number.isFinite(t.ref)?t.ref:((Number.isFinite(t.id)&&t.id>1e12)?t.id:Date.now()), done:!!t.done, ech:(t.ech==="weekend"||t.ech==="s2")?"prochaine":(okE(t.ech)?t.ech:"pense"), fav:!!t.fav, ...(perso&&nettS(t.sub).length?{sub:nettS(t.sub)}:{})}));
  const ts=nettT(d.taches,false), tp=Array.isArray(d.perso)?nettT(d.perso,true):null;
  const sup=(Array.isArray(d.supprimees)?d.supprimees:[]).filter(k=>BASE_KEYS.includes(k) && k!=="taches" && k!=="todo");
  return {taches:ts, perso:tp, rubriques:rubs, couleurs:cou, couleursEch:ce, echeances:ech, supprimees:sup};
}
function preparer(txt){
  try{
    pending = nettoyer(JSON.parse(txt));
    const np=pending.taches.length, nq=pending.perso?pending.perso.length:null, r=pending.rubriques.length;
    msgI(`Pro : ${np} tâche${np>1?"s":""} · Perso : ${nq===null?"non inclus (les tâches Perso actuelles sont conservées)":nq+" tâche"+(nq>1?"s":"")} · ${r} rubrique${r>1?"s":""} personnalisée${r>1?"s":""}. Cela remplace les données actuelles.`);
    $("impGo").disabled=false;
  }catch(e){ pending=null; $("impGo").disabled=true; msgI("Données non reconnues."); }
}
$("impTxt").oninput = () => { const t=$("impTxt").value.trim(); if(!t){ pending=null; $("impGo").disabled=true; msgI(""); } else preparer(t); };
$("impFile").onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  try{ const t=await f.text(); $("impTxt").value=t; preparer(t); }catch(_){ msgI("Lecture du fichier impossible."); }
  e.target.value="";
};
function resetCustom(){
  Object.keys(R).forEach(k=>delete R[k]);
  BASE_KEYS.forEach(k=>R[k]={...BASE_DEFS[k]});
  Object.keys(GR).forEach(sp=>{ GR[sp].length=0; BASE_GR[sp].forEach(g=>GR[sp].push([...g])); });
}
$("impGo").onclick = () => {
  if(!pending) return;
  resetCustom();
  echCustom.forEach(c=>delete E[c.key]); echCustom = pending.echeances||[]; echCustom.forEach(appliquerEch); sauverEchCustom();
  custom = pending.rubriques; custom.forEach(appliquerRub);
  supprimees = pending.supprimees; supprimees.forEach(retirerDuModele); sauverSupprimees();
  couleurs = pending.couleurs; Object.entries(couleurs).forEach(([k,c])=>{ if(R[k]) R[k].color=c; });
  store = {pro:pending.taches, perso:pending.perso||store.perso}; normaliser(store.pro,"pro"); normaliser(store.perso,"perso");
  taches = store[esp]; GROUPES = GR[esp]; rub=defRub(); qRub=defRub();
  if(pending.couleursEch){ couleursEch=pending.couleursEch; sauverCouleursEch(); }
  sauverRub(); sauver(); try{ localStorage.setItem("couleurs-v1", JSON.stringify(couleurs)); }catch(e){}
  pending=null; filtre="toutes"; fEch="toutes"; vue="toutes";
  majRubSeg(); majEchSeg(); majQaEch(); render(); $("bgS").classList.remove("open");
};

// ---------- Appui long sur une rubrique : choix de la couleur ----------
let lpT=null, lpFait=false, lpX=0, lpY=0, cKey=null, cType="rub";
function majCouleurs(){
  const cur = cType==="ech" ? couleursEch[cKey] : (R[cKey] && R[cKey].color);
  $("cCol").innerHTML = palette().map(c=>`<button type="button" class="swatch ${cur===c?"on":""}" data-c="${c}" style="background:${c}" aria-label="Couleur"></button>`).join("");
}
let cConf=false;
function majSuppr(){
  if(cType==="ech"){
    let h = couleursEch[cKey] ? `<button type="button" class="del-rub" data-act="defaut" style="margin:0 4px 12px;color:var(--text)">Couleur par défaut</button>` : "";
    if(E[cKey] && E[cKey].def){
      const n=[...store.pro,...store.perso].filter(t=>t.ech===cKey).length;
      h += cConf ? `<div class="note" style="margin:0 4px 8px">${n} tâche${n>1?"s":""} ser${n>1?"ont":"a"} déplacée${n>1?"s":""} vers « Mémo ».</div><div class="actions" style="margin-bottom:12px"><button type="button" class="cancel" data-act="annuler">Annuler</button><button type="button" class="danger-btn" data-act="confirmer">Supprimer l'échéance</button></div>`
        : `<button type="button" class="del-rub" data-act="suppr" style="margin:0 4px 12px">Supprimer cette échéance…</button>`;
    }
    $("cSuppr").innerHTML = h; return;
  }
  const k=cKey, n=taches.filter(t=>t.rub===k).length;
  $("cSuppr").innerHTML = k===defRub() ? "" : cConf
    ? `<div class="note" style="margin:0 4px 8px">${n} tâche${n>1?"s":""} ser${n>1?"ont":"a"} déplacée${n>1?"s":""} vers « ${esc(R[defRub()].label)} ».</div><div class="actions" style="margin-bottom:12px"><button type="button" class="cancel" data-act="annuler">Annuler</button><button type="button" class="danger-btn" data-act="confirmer">Supprimer la rubrique</button></div>`
    : `<button type="button" class="del-rub" data-act="suppr" style="margin:0 4px 12px">Supprimer cette rubrique…</button>`;
}
$("cSuppr").onclick = e => { const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="defaut"){ delete couleursEch[cKey]; sauverCouleursEch(); render(); $("bgC").classList.remove("open"); }
  else if(a.dataset.act==="suppr"){ cConf=true; majSuppr(); }
  else if(a.dataset.act==="annuler"){ cConf=false; majSuppr(); }
  else if(a.dataset.act==="confirmer"){ if(cType==="ech") supprimerEch(cKey); else supprimerRub(cKey); $("bgC").classList.remove("open"); } };
function ouvrirCouleur(k){
  if(!R[k]) return; cType="rub"; cKey=k; cConf=false; majSuppr();
  $("cTitre").textContent = `Couleur de « ${R[k].label} »`;
  majCouleurs(); $("bgC").classList.add("open");
}
function ouvrirCouleurEch(k){
  if(!E[k]) return; cType="ech"; cKey=k; cConf=false; majSuppr();
  $("cTitre").textContent = `Couleur de l'échéance « ${E[k].label} »`;
  majCouleurs(); $("bgC").classList.add("open");
}
const stopLP = () => { clearTimeout(lpT); lpT=null; };
$("segE").addEventListener("pointerdown", e=>{
  const b=e.target.closest("button[data-e]"); if(!b || b.dataset.e==="toutes") return;
  lpFait=false; lpX=e.clientX; lpY=e.clientY; const k=b.dataset.e;
  stopLP(); lpT=setTimeout(()=>{ lpT=null; lpFait=true; try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} ouvrirCouleurEch(k); }, 500);
});
$("segE").addEventListener("pointermove", e=>{ if(lpT && Math.hypot(e.clientX-lpX,e.clientY-lpY)>10) stopLP(); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("segE").addEventListener(ev, stopLP));
$("segE").addEventListener("contextmenu", e=>e.preventDefault());
$("seg").addEventListener("pointerdown", e=>{
  const b=e.target.closest("button[data-f]"); if(!b || b.dataset.f==="toutes") return;
  lpFait=false; lpX=e.clientX; lpY=e.clientY; const k=b.dataset.f;
  stopLP(); lpT=setTimeout(()=>{ lpT=null; lpFait=true; try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} ouvrirCouleur(k); }, 500);
});
$("seg").addEventListener("pointermove", e=>{ if(lpT && Math.hypot(e.clientX-lpX,e.clientY-lpY)>10) stopLP(); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("seg").addEventListener(ev, stopLP));
$("seg").addEventListener("contextmenu", e=>e.preventDefault());
$("cCol").onclick = e => { const b=e.target.closest(".swatch"); if(!b||!cKey) return;
  if(cType==="ech"){ couleursEch[cKey]=b.dataset.c; sauverCouleursEch(); render(); $("bgC").classList.remove("open"); return; }
  changerCouleur(cKey,b.dataset.c); majRubSeg(); render(); $("bgC").classList.remove("open"); };
$("cClose").onclick = () => $("bgC").classList.remove("open");
$("bgC").onclick = e => { if(e.target===$("bgC")) $("bgC").classList.remove("open"); };

// ---------- Saisie rapide sous le titre ----------
$("quick").onsubmit = e => {
  e.preventDefault();
  const titre=$("qa").value.trim(); if(!titre) return;
  const r = R[qRub] ? qRub : defRub();
  const ec = E[qEch] ? qEch : "semaine";
  taches.push({id:Date.now(), ref:Date.now(), titre, rub:r, done:false, ech:ec, fav:false});
  sauver(); $("qa").value=""; $("qa").blur(); if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur(); render();
};

// ---------- Espaces Pro / Perso ----------
function appliquerTheme(){
  document.documentElement.dataset.esp = esp;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content = esp==="perso" ? "#1c2951" : "#5e654b";
}
function changerEspace(sp){
  if(sp===esp) return;
  store[esp]=taches; esp=sp; taches=store[esp]; GROUPES=GR[esp];
  try{ localStorage.setItem("espace-v1", esp); }catch(e){}
  filtre="toutes"; fEch="toutes"; confSuppr=false; rub=defRub(); qRub=defRub(); editId=null;
  appliquerTheme();
  if($("q").parentNode.classList.contains("open")) basculerRecherche(false);
  majRubSeg(); majEchSeg(); majQaEch(); render();
}
$("espSeg").onclick = e => { const b=e.target.closest("button"); if(b) changerEspace(b.dataset.s); };
try{ masquer = localStorage.getItem("masquer-v1")==="1"; }catch(e){}
$("hideDone").checked = masquer;
chargerRub(); chargerSupprimees(); chargerCouleurs(); chargerCouleursEch(); chargerEchCustom(); assurerDefauts(); chargerAuto(); charger(); avancerEch(); majRubSeg(); setRub(defRub()); ech="pense"; majEchSeg(); render(); majAuto();
</script>
</body>
</html>
